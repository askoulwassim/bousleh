name: close outside pull requests
# Bousleh is a personal project: pull requests from anyone but the owner (and Dependabot) are closed
# with a kind note. This runs on pull_request_target so it can comment on pull requests from forks,
# and so it never checks out or runs their code.
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  pull-requests: write
jobs:
  close:
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CONTRIBUTING: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md
        run: |
          body="Thanks for this. Bousleh is a personal project, built for its owner and for Claude only, so pull requests from others aren't accepted and this one is closed automatically. Issues are welcome, for bugs and ideas. And please fork it and make it yours: the MIT license allows anything. More in [CONTRIBUTING.md]($CONTRIBUTING)."
          gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          gh api -X PATCH "repos/$REPO/pulls/$PR" -f state=closed > /dev/null

name: Bug report
description: Something in Bousleh doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please leave out personal data (names, emails, notes from your own Bousleh data).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Output of scripts/setup-mac.sh --check
      description: It reports what is set up and changes nothing.
      render: text
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which Claude surface?
      options:
        - Claude desktop app chat
        - Claude desktop app Code tab
        - Claude Code (terminal)
        - claude.ai web
        - Claude mobile app
    validations:
      required: true

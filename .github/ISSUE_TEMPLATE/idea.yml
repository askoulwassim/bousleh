name: Idea
description: Something you'd like Bousleh to do. Read as inspiration, not a request.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: How it could work. Sketches welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would help with.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which Claude surface?
      options:
        - Claude desktop app chat
        - Claude desktop app Code tab
        - Claude Code (terminal)
        - claude.ai web
        - Claude mobile app
    validations:
      required: true
